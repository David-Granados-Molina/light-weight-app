<!doctype html>
<html lang="es" class="app-dark">
<head>
  <meta charset="utf-8">
  <title>Light Weight</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Registro personal de entrenamiento: series, peso, tiempo y EMOM, rutinas y progreso.">
  <meta name="theme-color" content="#0A0B0D">
  <link rel="icon" type="image/svg+xml" href="icons/light-weight-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* Pantalla de arranque. Vive aquí porque tiene que pintarse antes de que
       cargue nada de Angular; repite a mano los valores del sistema. */
    .app-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0b0d;
      color: #666e7c;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .app-boot-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #f1f3f7;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.014em;
    }
    .app-boot-track {
      width: 132px;
      height: 2px;
      border-radius: 999px;
      background: #1d222c;
      overflow: hidden;
    }
    .app-boot-fill {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #ffbf00;
      animation: app-boot-slide 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes app-boot-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-boot-fill { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-boot">
      <div class="app-boot-mark">
        <img src="icons/light-weight-icon.svg" width="30" height="30" alt="" style="border-radius: 6px;">
        Light Weight
      </div>
      <div class="app-boot-track"><div class="app-boot-fill"></div></div>
    </div>
  </app-root>
</body>
</html>
