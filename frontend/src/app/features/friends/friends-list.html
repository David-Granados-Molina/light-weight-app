<div class="lw-page lw-page-wide fr">
  <header class="lw-head">
    <a routerLink="/perfil" class="lw-icon-btn lw-icon-btn-bordered" aria-label="Volver al perfil">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
    </a>
    <h1 class="lw-title">Amigos</h1>
  </header>

  @if (loading()) {
    <div class="fr-grid" aria-busy="true">
      <div class="lw-skel fr-skel"></div>
      <div class="lw-skel fr-skel"></div>
      <div class="lw-skel fr-skel"></div>
    </div>
  } @else {
    <div class="fr-grid">
      @for (user of users(); track user.id) {
        <article class="lw-card fr-card">
          <div class="fr-user">
            <span class="fr-avatar">
              <app-avatar [avatarId]="user.avatarUrl" [fallback]="user.name.charAt(0)" />
            </span>
            <div class="fr-user-text">
              <h2 class="fr-name">{{ user.name }}</h2>
              <p class="fr-email">{{ user.email }}</p>
            </div>
          </div>

          <div class="fr-actions">
            <a class="fr-action" [routerLink]="['/amigos', user.id, 'historial']" [queryParams]="{ name: user.name }">
              Historial
            </a>
            <a class="fr-action" [routerLink]="['/amigos', user.id, 'progreso']" [queryParams]="{ name: user.name }">
              Progreso
            </a>
            <a class="fr-action" [routerLink]="['/amigos', user.id, 'rutinas']" [queryParams]="{ name: user.name }">
              Rutinas
            </a>
          </div>
        </article>
      } @empty {
        <div class="lw-empty fr-empty">
          <svg class="lw-empty-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="8" r="3.5" />
            <path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a3 3 0 1 0 0-6M18 20a6 6 0 0 0-3-5.2" />
          </svg>
          <p class="lw-empty-title">No hay más usuarios todavía</p>
          <p class="lw-empty-text">Cuando se registre alguien más, aparecerá aquí con su historial y su progreso.</p>
        </div>
      }
    </div>
  }
</div>
