<div class="auth">
  <div class="auth-brand">
    <img src="icons/light-weight-icon.svg" width="34" height="34" alt="" class="auth-logo" />
    <span class="auth-brand-name">Light Weight</span>
  </div>

  <h1 class="auth-title">Iniciar sesión</h1>
  <p class="auth-subtitle">Accede para registrar tus entrenos.</p>

  <div class="auth-form">
    <div class="lw-field">
      <label class="lw-label" for="login-email">Email</label>
      <input
        id="login-email"
        class="lw-input"
        type="email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        [value]="email()"
        [disabled]="loading()"
        (input)="onEmailInput($event)"
      />
    </div>

    <div class="lw-field">
      <label class="lw-label" for="login-password">Contraseña</label>
      <input
        id="login-password"
        class="lw-input"
        type="password"
        placeholder="Tu contraseña"
        autocomplete="current-password"
        [value]="password()"
        [disabled]="loading()"
        (input)="onPasswordInput($event)"
        (keydown.enter)="submit()"
      />
    </div>

    <a routerLink="/recuperar" class="auth-inline-link">¿Has olvidado tu contraseña?</a>

    @if (error()) {
      <div class="lw-error" role="alert">{{ error() }}</div>
    }

    <button type="button" class="lw-btn-primary lw-btn-block" [disabled]="!canSubmit()" (click)="submit()">
      {{ loading() ? 'Entrando…' : 'Iniciar sesión' }}
    </button>

    @if (googleAvailable) {
      <div class="auth-divider">o</div>
      <div class="google-btn-wrap" #googleBtn></div>
    }

    <div class="auth-divider">o</div>
    <button type="button" class="lw-btn-secondary lw-btn-block" [disabled]="loading()" (click)="loginAsTestUser()">
      Entrar con la cuenta de prueba
    </button>
  </div>
</div>

@if (loading()) {
  <div class="auth-blocking">
    <app-exercise-loader text="Iniciando sesión…" />
  </div>
}
