<div class="auth">
  <div class="auth-brand">
    <img src="icons/light-weight-icon.svg" width="34" height="34" alt="" class="auth-logo" />
    <span class="auth-brand-name">Light Weight</span>
  </div>

  <h1 class="auth-title">Recuperar contraseña</h1>
  <p class="auth-subtitle">Te enviamos un enlace para restablecerla.</p>

  @if (sent()) {
    <div class="lw-success" role="status">
      Si existe una cuenta con ese email, recibirás un enlace para restablecer tu contraseña. Revisa también la carpeta
      de spam.
    </div>
  } @else {
    <div class="auth-form">
      <div class="lw-field">
        <label class="lw-label" for="forgot-email">Email</label>
        <input
          id="forgot-email"
          class="lw-input"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
          [value]="email()"
          (input)="onEmailInput($event)"
          (keydown.enter)="submit()"
        />
      </div>

      @if (error()) {
        <div class="lw-error" role="alert">{{ error() }}</div>
      }

      <button type="button" class="lw-btn-primary lw-btn-block" [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'Enviando…' : 'Enviar enlace' }}
      </button>
    </div>
  }

  <p class="auth-footer"><a routerLink="/login">Volver a iniciar sesión</a></p>
</div>
