<dialog #dialog class="lightbox" (cancel)="onCancelEvent($event)" (click)="onBackdropClick($event)">
  <figure class="lightbox-figure">
    <img class="lightbox-img" [src]="src()" [alt]="alt()" />
    @if (credit(); as texto) {
      <figcaption class="lightbox-credit">{{ texto }}</figcaption>
    }
  </figure>

  <button type="button" class="lightbox-close" aria-label="Cerrar" (click)="closed.emit()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>
</dialog>
