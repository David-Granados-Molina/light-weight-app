<dialog #dialog class="dialog" (cancel)="onCancelEvent($event)" (click)="onBackdropClick($event)">
  <div class="dialog-body">
    <h2 class="dialog-title">{{ title() }}</h2>
    @if (message()) {
      <p class="dialog-message">{{ message() }}</p>
    }
    <div class="dialog-actions" [class.is-stacked]="!!altText()">
      <button
        type="button"
        class="lw-btn-secondary"
        [attr.autofocus]="danger() ? '' : null"
        (click)="cancelled.emit()"
      >
        {{ cancelText() }}
      </button>
      @if (altText()) {
        <button type="button" class="lw-btn-secondary" (click)="alternate.emit()">{{ altText() }}</button>
      }
      <button
        type="button"
        [class.lw-btn-danger]="danger()"
        [class.lw-btn-primary]="!danger()"
        [attr.autofocus]="danger() ? null : ''"
        (click)="confirmed.emit()"
      >
        {{ confirmText() }}
      </button>
    </div>
  </div>
</dialog>
