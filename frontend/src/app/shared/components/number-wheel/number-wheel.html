<div class="wheel" [class.compact]="compact()">
  <button
    type="button"
    class="wheel-step"
    (click)="decrement()"
    [disabled]="(value() ?? min()) <= min()"
    [attr.aria-label]="'Disminuir ' + (unit() || 'valor')"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M5 12h14" />
    </svg>
  </button>

  <div class="wheel-value">
    <input
      class="wheel-input lw-num"
      type="text"
      inputmode="decimal"
      [attr.aria-label]="unit() || 'Valor'"
      [value]="displayValue()"
      (focus)="onFocus()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      (keydown.enter)="onEnter($event)"
    />
    @if (unit()) {
      <span class="wheel-unit">{{ unit() }}</span>
    }
  </div>

  <button
    type="button"
    class="wheel-step"
    (click)="increment()"
    [disabled]="(value() ?? min()) >= max()"
    [attr.aria-label]="'Aumentar ' + (unit() || 'valor')"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M5 12h14M12 5v14" />
    </svg>
  </button>
</div>
