<a routerLink="/inicio" class="rail-brand">
  <img src="icons/light-weight-icon.png" width="30" height="30" alt="" class="rail-logo" />
  <span class="rail-brand-name">Light Weight</span>
</a>

<a routerLink="/registrar" routerLinkActive="is-active" class="rail-cta">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <path d="M12 5v14M5 12h14" />
  </svg>
  Registrar entreno
  @if (hasDraftInProgress()) {
    <span class="rail-cta-dot" aria-hidden="true"></span>
    <span class="lw-sr-only">Tienes un entreno sin guardar</span>
  }
</a>

<nav class="rail-nav" aria-label="Navegación principal">
  <a routerLink="/inicio" routerLinkActive="is-active" class="rail-link">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5" />
      <path d="M5 9.5V21h14V9.5" />
    </svg>
    <span>Inicio</span>
  </a>

  <a routerLink="/historial" routerLinkActive="is-active" class="rail-link">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h16M4 18h10" />
    </svg>
    <span>Historial</span>
  </a>

  <a routerLink="/progreso" routerLinkActive="is-active" class="rail-link">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19V5M4 19h16" />
      <path d="M8 15l3.5-4 3 2.5L21 7" />
    </svg>
    <span>Progreso</span>
  </a>

  <a routerLink="/rutinas" routerLinkActive="is-active" class="rail-link">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4v16M18 4v16M3 9h6M15 9h6M3 15h6M15 15h6" />
    </svg>
    <span>Rutinas</span>
  </a>

  <a routerLink="/calendario" routerLinkActive="is-active" class="rail-link">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 10h18M8 3v4M16 3v4" />
    </svg>
    <span>Calendario</span>
  </a>
</nav>

<a routerLink="/perfil" routerLinkActive="is-active" class="rail-user">
  <span class="rail-user-avatar">
    <app-avatar [avatarId]="avatarId()" [fallback]="initial()" />
  </span>
  <span class="rail-user-text">
    <span class="rail-user-name">{{ userName() }}</span>
    <span class="rail-user-role">Ver perfil</span>
  </span>
</a>
