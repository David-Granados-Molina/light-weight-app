services:
  - type: web
    name: light-weight-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 180d
      - key: RESEND_API_KEY
        sync: false
      # Mientras el remitente sea la dirección compartida de Resend, TODOS los
      # códigos van a este buzón con el email de quien lo pidió en el asunto.
      # Declarada aquí, y no solo en el panel, para que una sincronización del
      # blueprint no se la lleve por delante y para que no haya duda de en cuál
      # de los dos servicios vive. Se borra cuando haya dominio verificado.
      - key: LOGIN_CODE_RELAY_TO
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGIN
        value: https://light-weight-app.onrender.com
      - key: FRONTEND_URL
        value: https://light-weight-app.onrender.com

  - type: web
    name: light-weight-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/FitnessApp/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
